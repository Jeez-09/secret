<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/jpeg" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTirV7AQXJy1FPujlo5m80Rup5O22nBJ3nJ-7RMQEtjRw&s=10">
    <title>Forget-me-not</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Georgia', serif;
            overflow-x: hidden;
        }

      
        .page-container {
            background-image: url('boss-mahal1.jpg'); 
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
			background-image: linear-gradient(rgba(0, 0, 0, 0.5), 
			rgba(0, 0, 0, 0.5)), url('boss-mahal1.jpg');
            
           
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            padding: 0;
			margin: 0;
        }

      
        .center-stage {
			display: flex;
			align-items: center;
			justify-content: space-between;
			width: 100%;
			height: 100vh; 
			max-width: 100%; 
			gap: 0; 
		}	

     
        .note-card {
            width: 60%;
			height: 100%;
			display: flex;
			flex-direction: column;
			justify-content: center;
			padding: 10%; 
			background-color: #ffc0cb;
			background-color: rgba(47, 132, 204, 0.5);
			border-radius: 0; 
			box-shadow: none;
			opacity: 0;
			animation: fadeInEffect 2.5s ease-in-out forwards;
		}

        .poem-title {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 2rem;
            border-bottom: 1px solid #e0dad0;
            padding-bottom: 0.5rem;
        }

        .poem-lines {
            font-size: 1.15rem;
            line-height: 2.6;
            color: #ffffff;
            white-space: pre-line;
        }
		

       
        .rose-container {
			width: 40%; 
			height: 100%;
			background-color: #0b0c10; 
			background-color: rgba(11, 12, 16, 0.5);
			background-image: url('forgetmenot.png'); 
			background-position: center center;
			background-repeat: no-repeat;
			background-size: contain;
			flex-shrink: 0;
			
			opacity: 0;
            animation: fadeInEffect 2.5s ease-in-out forwards;
		}	


        @keyframes fadeInEffect {
            from {
                opacity: 0;
                transform: scale(0.95); 
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }


        @media (max-width: 850px) {
            .page-container {
                height: auto;
                min-height: 100vh;
            }
            .center-stage {
                flex-direction: column;
                gap: 3rem;
            }
            .note-card, .rose-container {
                width: 100%;
                max-width: 420px;
            }
            .rose-container {
                height: 1000px;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        

        <div class="center-stage">
            

            <div class="note-card">
                <h1 class="poem-title">Forget-me-not</h1>
                <p class="poem-lines">
                    Bond so beautiful,
					Ye art etched into the soul.
					Oh, bewitching laughs,
					Thrive as myosotis flower.
					Shall such ephemera last?
                </p>
				
            </div>
	
          
            <div class="rose-container"></div>
		
        </div>

    </div>
