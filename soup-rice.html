    <style>
        body {
            background-color: #90d5ff;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 40px 0;
            box-sizing: border-box;
        }
        h2 {
            color: #ffffff;
            margin-bottom: 90px;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.3);
        }

        /* --- THE BOUQUET CANVAS SYSTEM --- */
        .bouquet-container {
            position: relative;
            width: 500px;
            height: 600px;
        }

        /* --- BACKGROUND PACKAGING LAYER --- */
        .bouquet-paper {
            position: absolute;
            top: 0px;
            left: -45px;
            width: 650px;
            height: auto;
            z-index: 1;
        }

        /* --- CORNER RIBBON LAYER --- */
        .bouquet-ribbon {
            position: absolute;
            bottom: -55px;
            left: 140px;
            width: 280px;
            height: auto;
            z-index: 30;
        }

        /* --- STYLING THE FLOWER IMAGE LINKS --- */
        .flower-link {
            position: absolute;
            display: inline-block;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 10;
            /* Applies a continuous gentle floating animation */
            animation: gentleFloat 4s ease-in-out infinite;
        }

        .flower-link img {
            width: 105px;       
            height: 105px;
            object-fit: cover;
            border-radius: 50%; 
            border: 3px solid #ffb6c1;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

        /* Hover effect: Makes flowers bloom slightly when hovered */
        .flower-link:hover {
            transform: scale(1.15) translateY(-5px) !important;
            z-index: 50 !important; 
            animation-play-state: paused; /* Pauses float motion while interacting */
        }

        /* --- CSS SWAYING ANIMATION KEYFRAMES --- */
        @keyframes gentleFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1.5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* --- STAGGERED ANIMATION DELAYS (Breathes life into the bunch) --- */
        .delay-1 { animation-delay: 0.0s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.8s; }
        .delay-4 { animation-delay: 1.2s; }
        .delay-5 { animation-delay: 1.6s; }

        /* --- RADIAL BOUQUET COORDINATES (18 FLOWER SLOTS) --- */
        /* Row 1 - Highest Arc Backing (5 Flowers) */
        .f-row1-1 { top: -20px; left: 30px; }
        .f-row1-2 { top: -45px; left: 120px; }
        .f-row1-3 { top: -55px; left: 210px; }
        .f-row1-4 { top: -45px; left: 300px; }
        .f-row1-5 { top: -20px; left: 390px; }

        /* Row 2 - Upper Middle Density (5 Flowers) */
        .f-row2-1 { top: 55px; left: 45px; z-index: 11; }
        .f-row2-2 { top: 40px; left: 135px; z-index: 11; }
        .f-row2-3 { top: 35px; left: 225px; z-index: 11; }
        .f-row2-4 { top: 40px; left: 315px; z-index: 11; }
        .f-row2-5 { top: 55px; left: 405px; z-index: 11; }

        /* Row 3 - Mid-Core Focal Layer (4 Flowers) */
        .f-row3-1 { top: 130px; left: 85px; z-index: 12; }
        .f-row3-2 { top: 115px; left: 175px; z-index: 12; }
        .f-row3-3 { top: 115px; left: 265px; z-index: 12; }
        .f-row3-4 { top: 130px; left: 355px; z-index: 12; }

        /* Row 4 - Narrow Lower Cluster (3 Flowers) */
        .f-row4-1 { top: 210px; left: 125px; z-index: 13; }
        .f-row4-2 { top: 195px; left: 215px; z-index: 13; }
        .f-row4-3 { top: 210px; left: 305px; z-index: 13; }

        /* Row 5 - Tucked Anchor Flower (1 Center Flower) */
        .f-row5-1 { top: 275px; left: 215px; z-index: 14; }

	 @media (max-width: 550px) {
            h2 {
                font-size: 19px;
                margin-bottom: 10px;
            }
            .bouquet-wrapper {
                height: 440px; /* Shrinks container window height boundary */
            }
            .bouquet-container {
                transform: scale(0.70); /* Uniformly compresses bouquet size for smaller viewports */
            }
        }

        @media (max-width: 380px) {
            .bouquet-container {
                transform: scale(0.58); /* Compresses layout further for tight mobile viewports */
            }
        }

    </style>
</head>
